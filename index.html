<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Harness 全景指南</title>
    <meta name="description" content="Agent Harness 技术栈全景指南：九层地图与 16 个开源项目学习路径" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ahl-appearance')
          var dark =
            saved === 'dark' ||
            ((saved === 'system' || !saved) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var href = (dark ? '/favicon-dark.svg' : '/favicon.svg') + '?v=atlas-eye'
          var icon = document.querySelector('link[rel="icon"]')
          var apple = document.querySelector('link[rel="apple-touch-icon"]')
          if (icon) icon.setAttribute('href', href)
          if (apple) apple.setAttribute('href', href)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
